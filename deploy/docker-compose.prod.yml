# The deployment stack: one host, four containers, TLS terminated at the edge.
#
# Run it from this directory:
#
#   cp .env.example .env      # then fill it in
#   docker compose -f docker-compose.prod.yml up -d
#
# What is different from the development `docker-compose.yml` at the repository
# root, and why:
#
#   * Nothing but the proxy publishes a port. In development Postgres is on
#     5432 and the API on 8080 so a developer can reach them; on a real host
#     that is a database and an unencrypted API exposed to whatever the machine
#     is exposed to. Here they exist only on the internal network.
#   * TLS is not optional. The refresh token is an `HttpOnly; Secure` cookie,
#     and a `Secure` cookie over plain HTTP is a cookie the browser discards —
#     the panel would sign people out on every reload and nobody would know
#     why. Caddy obtains and renews the certificate itself.
#   * The API is told exactly which address to trust `X-Forwarded-For` from.
#     Without it every request appears to come from the proxy, and per-IP rate
#     limiting throttles the whole company as one client.
#
# See docs/PROVISIONING.md §6 for the host preparation this assumes.

name: construction

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: construction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d construction"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    image: ${API_IMAGE:-ghcr.io/sickmajkan-design/planconcept-stas-organizer/api:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=construction;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY to at least 32 random characters}
      Seed__SuperAdmin__Email: ${SUPERADMIN_EMAIL:?set SUPERADMIN_EMAIL}
      Seed__SuperAdmin__Password: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD}

      # True here, unlike development, and it is safe for exactly one reason:
      # this file runs a single API container. Two replicas starting together
      # would race to apply the same migration. If this stack ever grows a
      # second replica, turn this off and run migrations as their own step
      # before the rollout — see docs/PROVISIONING.md §6.4.
      Database__ApplyMigrationsOnStartup: "true"

      # The proxy's address on the internal network, pinned below. Not a range
      # and not "trust everything": the whole point of the setting is that an
      # attacker able to reach the API directly cannot forge a client address.
      Network__TrustedProxies: "172.28.0.2"

      # Where password-reset links point. Wrong here means an email nobody can
      # use, and the API refuses to start in Production if it still says
      # localhost.
      ClientApp__PasswordResetUrl: "${PUBLIC_ORIGIN:-https://${DOMAIN:?set DOMAIN in .env}}/reset-password"

      EmailSettings__Host: ${SMTP_HOST:-}
      EmailSettings__Port: ${SMTP_PORT:-587}
      EmailSettings__Username: ${SMTP_USERNAME:-}
      EmailSettings__Password: ${SMTP_PASSWORD:-}
      EmailSettings__FromAddress: ${SMTP_FROM:-}
      # Deliberate opt-out, so "we have no SMTP yet" is a decision recorded in
      # the environment rather than a surprise the first time somebody forgets
      # their password.
      EmailSettings__AllowUnconfigured: ${SMTP_ALLOW_UNCONFIGURED:-false}

      Firebase__CredentialsJson: ${FIREBASE_CREDENTIALS_JSON:-}

      FileStorage__Bucket: ${FILE_STORAGE_BUCKET:-}
      FileStorage__ServiceUrl: ${FILE_STORAGE_SERVICE_URL:-}
      FileStorage__Region: ${FILE_STORAGE_REGION:-}
      FileStorage__AccessKey: ${FILE_STORAGE_ACCESS_KEY:-}
      FileStorage__SecretKey: ${FILE_STORAGE_SECRET_KEY:-}
      FileStorage__RootPath: /var/lib/construction/storage

      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: construction-api
    volumes:
      - attachment-data:/var/lib/construction/storage
    networks:
      - internal

  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/sickmajkan-design/planconcept-stas-organizer/admin:latest}
    restart: unless-stopped
    environment:
      # Same origin as the panel itself, so the browser sends the refresh
      # cookie without any CORS involved. The proxy routes /api to the API.
      #
      # PUBLIC_ORIGIN is what people type, which is only `https://DOMAIN` when
      # the stack owns ports 80 and 443. On any other port it has to say so —
      # this string is handed to the browser, and a browser cannot guess a port.
      API_BASE_URL: "${PUBLIC_ORIGIN:-https://${DOMAIN:?set DOMAIN in .env}}"
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - admin
    # Configurable, because a host that already runs something on 80 is an
    # ordinary situation, and because the smoke test has to share a machine
    # with whatever else is on it. The defaults are what a dedicated host
    # wants; anything else needs PUBLIC_ORIGIN set to match, or the panel will
    # be handed an address nobody can reach.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # Let's Encrypt uses this only to warn about expiry it could not renew.
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the account key. Losing this volume means re-issuing
      # on the next start, which is fine but counts against rate limits.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      internal:
        ipv4_address: 172.28.0.2

  # Nightly backup, on by default here — unlike development, where it is behind
  # a profile. A deployment without backups is the failure this whole section
  # exists to prevent.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: construction
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      ATTACHMENT_DIR: /var/lib/construction/storage
      OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      OFFSITE_BUCKET: ${OFFSITE_BUCKET:-}
      OFFSITE_PREFIX: ${OFFSITE_PREFIX:-construction/}
      OFFSITE_REGION: ${OFFSITE_REGION:-us-east-1}
      OFFSITE_PATH_STYLE: ${OFFSITE_PATH_STYLE:-0}
      OFFSITE_AGE_RECIPIENT: ${OFFSITE_AGE_RECIPIENT:-}
      AWS_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
    volumes:
      - ../scripts:/scripts:ro
      - backup-data:/backups
      - attachment-data:/var/lib/construction/storage:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache bash coreutils findutils tar curl openssl age >/dev/null
        while true; do
          bash /scripts/backup.sh || echo "backup failed" >&2
          sleep 86400
        done
    networks:
      - internal

networks:
  # A fixed subnet so the proxy can have a fixed address, which is what the
  # API's trusted-proxy list needs. Docker's default pool would give Caddy a
  # different address after a recreate, and the API would silently stop
  # trusting the forwarded client IP.
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
  attachment-data:
  backup-data:
  caddy-data:
  caddy-config:
