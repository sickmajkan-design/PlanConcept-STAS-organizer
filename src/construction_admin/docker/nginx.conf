# Serving a single-page app, on an unprivileged port.
#
# 8080 rather than 80 so the container needs no capability to bind, which lets
# it run read-only and non-root behind the proxy.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressed responses for the things that are large and text: the bundle
    # is most of what a first visit costs on a site office's connection.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset file names, so they can be cached until the name changes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cached, and this is the one that matters. `config.js` is rewritten
    # at container start with the addresses for this installation; a browser
    # holding yesterday's copy would talk to yesterday's API.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Same reasoning: the document names the current bundle. Cache it and a
    # deploy is invisible until somebody clears their browser.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing. /employees/new is a React route, not a file, so
    # anything that is not a real file has to be answered with the document —
    # otherwise a reload on any screen but the home page is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The response headers that matter are set by the API for its own
    # responses and by the reverse proxy for these; see the Caddyfile. They are
    # not repeated here, because two places setting the same header is how they
    # come to disagree.
}
