<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Obrazac za sedmični izvještaj</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#1b1b1d}
.ph *{box-sizing:border-box}
.ph{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#ececec;background:#1b1b1d;width:390px;height:900px;display:flex;flex-direction:column;overflow:hidden}
.lbl{font-size:12px;color:#b0b0b8;margin-bottom:4px;display:block}
.field{width:100%;min-height:48px;background:#26262a;color:#ececec;border:1px solid #4a4a52;border-radius:10px;padding:0 12px;font:inherit;font-size:16px}
.field.num{text-align:right}
.field:focus{outline:2px solid #f1b24a;outline-offset:1px}
.card{background:#26262a;border:1px solid #34343a;border-radius:12px;padding:12px}
.btn{font:inherit;font-size:15px;min-height:48px;border-radius:10px;border:1px solid #4a4a52;background:#2c2c31;color:#ececec;cursor:pointer;padding:0 14px}
.btn.primary{background:#f1b24a;color:#1b1b1d;border-color:#f1b24a;font-weight:700}
.shot{width:84px;height:110px;border-radius:8px;background:#f2efe6;border:1px solid #4a4a52;position:relative;flex:0 0 auto}
.shot i{position:absolute;left:10px;right:10px;height:2px;background:#b9b4a4}
.shot b{position:absolute;right:-8px;top:-8px;width:28px;height:28px;border-radius:50%;background:#3a3a40;border:1px solid #5a5a62;color:#ececec;font-weight:400;text-align:center;line-height:26px;font-size:15px}
.add{width:84px;height:110px;border-radius:8px;border:2px dashed #5a5a62;background:transparent;color:#d8d8dc;font:inherit;font-size:13px;cursor:pointer;flex:0 0 auto}
</style>
</helmet>
<div class="ph">
  <div style="padding:14px 16px;border-bottom:1px solid #34343a;display:flex;align-items:center;gap:10px">
    <button class="btn" style="min-height:44px;width:44px;padding:0" aria-label="Nazad">←</button>
    <div style="font-size:18px;font-weight:700">Sedmični izvještaj</div>
  </div>

  <div style="flex:1;min-height:0;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px">
    <div>
      <label class="lbl" for="site">Gradilište</label>
      <select id="site" class="field"><option>Aldi</option><option>Hala B</option></select>
    </div>

    <div style="display:flex;gap:10px;align-items:flex-end">
      <div style="flex:1">
        <label class="lbl" for="kw">Sedmica</label>
        <select id="kw" class="field"><option>KW42 · 12.–18.10.2026</option><option>KW41 · 5.–11.10.2026</option></select>
      </div>
      <div style="flex:0 0 96px;text-align:right">
        <span class="lbl">Rok</span>
        <div style="min-height:48px;display:flex;align-items:center;justify-content:flex-end;font-size:13px;color:#f1b24a">pon 12:00</div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <b style="font-size:15px">Radnici i sati</b>
        <span style="font-size:12px;color:#b0b0b8">s gradilišta ove sedmice</span>
      </div>
      <sc-for list="{{workers}}" as="w" hint-placeholder-count="5">
        <div style="display:flex;align-items:center;gap:10px;padding:5px 0">
          <div style="flex:1;min-width:0;font-size:15px">{{w.name}}</div>
          <input class="field num" style="width:96px" type="text" inputmode="decimal" aria-label="Sati" value="{{w.hours}}" onChange="{{w.onHours}}">
          <span style="width:14px;color:#b0b0b8;font-size:13px">h</span>
        </div>
      </sc-for>
      <button class="btn" style="width:100%;margin-top:6px">+ Dodaj radnika koji nije na listi</button>
      <div style="display:flex;justify-content:space-between;border-top:1px solid #34343a;margin-top:10px;padding-top:10px;font-size:16px">
        <b>Ukupno</b><b>{{total}} h</b>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
        <b style="font-size:15px">Slike potpisane satnice</b>
        <span style="font-size:12px;color:#b0b0b8">{{photoCount}} {{photoWord}}</span>
      </div>
      <div style="display:flex;gap:12px;overflow-x:auto;padding:8px 8px 4px 0">
        <sc-for list="{{shots}}" as="s" hint-placeholder-count="2">
          <div class="shot"><i style="top:22px"></i><i style="top:40px"></i><i style="top:58px"></i><i style="top:76px"></i><b>×</b></div>
        </sc-for>
        <button class="add" onClick="{{addShot}}">+ Slikaj<br>ili izaberi</button>
      </div>
      <div style="font-size:12px;color:#b0b0b8;margin-top:8px">Ako je sedmica na više listova, dodajte sve slike u isti izvještaj.</div>
    </div>

    <div>
      <label class="lbl" for="note">Napomena (nije obavezno)</label>
      <textarea id="note" class="field" style="min-height:72px;padding:10px 12px" rows="2"></textarea>
    </div>
  </div>

  <div style="padding:12px 16px;border-top:1px solid #34343a;background:#1b1b1d">
    <button class="btn primary" style="width:100%;min-height:52px;font-size:16px" disabled="{{cannotSend}}">{{sendLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hours: ['45', '42,5', '40', '45', '40'], photos: 2 };
  }
  renderVals() {
    const names = ['Adin Čengić', 'Igor Pijetlović', 'Jovica Krstić', 'Vladimir Gjorgijev', 'Vladimir Radojčić'];
    const num = (s) => { const v = parseFloat(String(s).replace(',', '.')); return isNaN(v) ? 0 : v; };
    const fmt = (n) => (Math.round(n * 10) / 10).toString().replace('.', ',');
    const st = this.state;
    let total = 0;
    const workers = names.map((name, i) => {
      total += num(st.hours[i]);
      return { name, hours: st.hours[i], onHours: (e) => { const a = st.hours.slice(); a[i] = e.target.value; this.setState({ hours: a }); } };
    });
    const shots = [];
    for (let i = 0; i < st.photos; i++) shots.push({ n: i + 1 });
    return {
      workers, shots,
      total: fmt(total),
      photoCount: st.photos,
      photoWord: st.photos === 1 ? 'slika' : 'slike',
      addShot: () => this.setState({ photos: st.photos + 1 }),
      cannotSend: st.photos === 0,
      sendLabel: st.photos === 0 ? 'Dodajte bar jednu sliku' : 'Pošalji izvještaj (' + st.photos + ' ' + (st.photos === 1 ? 'slika' : 'slike') + ', ' + fmt(total) + ' h)'
    };
  }
}
</script>
</body>
</html>
