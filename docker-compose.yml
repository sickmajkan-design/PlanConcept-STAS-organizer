services:
  postgres:
    image: postgres:16-alpine
    container_name: construction-postgres
    environment:
      POSTGRES_DB: construction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env first}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d construction"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Construction.API/Dockerfile
    container_name: construction-api
    depends_on:
      postgres:
        condition: service_healthy
    # Every secret below uses `:?` rather than a default on purpose. A default
    # that works is a default that ships: with fallbacks here, `docker compose
    # up` produced a running system with a publicly known JWT signing key and a
    # known Super Admin password. Compose now refuses to start until they are
    # set, and `.env.example` makes that one copy away for local development.
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=construction;Username=postgres;Password=${POSTGRES_PASSWORD:?copy .env.example to .env first}"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY to at least 32 random characters}
      Seed__SuperAdmin__Email: ${SUPERADMIN_EMAIL:?set SUPERADMIN_EMAIL}
      Seed__SuperAdmin__Password: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD}
      # Off unless asked for: concurrent replicas would race to migrate.
      Database__ApplyMigrationsOnStartup: ${APPLY_MIGRATIONS_ON_STARTUP:-false}
      # Empty means "trust no proxy", which is correct when the API is reached
      # directly. Set it to the proxy address when running behind one.
      Network__TrustedProxies: ${TRUSTED_PROXIES:-}
      # Service-account JSON for Firebase Cloud Messaging, passed inline rather
      # than as a mounted path so no credential file has to exist on the host.
      # Empty means push is logged instead of sent, which is what every
      # environment without a Firebase project should do.
      Firebase__CredentialsJson: ${FIREBASE_CREDENTIALS_JSON:-}
      # Empty bucket means the container's own disk, which the volume below
      # keeps across restarts. Set a bucket to use object storage instead.
      FileStorage__Bucket: ${FILE_STORAGE_BUCKET:-}
      FileStorage__ServiceUrl: ${FILE_STORAGE_SERVICE_URL:-}
      FileStorage__Region: ${FILE_STORAGE_REGION:-}
      FileStorage__AccessKey: ${FILE_STORAGE_ACCESS_KEY:-}
      FileStorage__SecretKey: ${FILE_STORAGE_SECRET_KEY:-}
      FileStorage__RootPath: /var/lib/construction/storage
    ports:
      - "8080:8080"
    # No container healthcheck here on purpose. The .NET runtime image ships
    # without curl or wget, so the usual one-liner would report unhealthy
    # forever, and adding an HTTP client to a production image to check a URL
    # from inside it is a poor trade. An orchestrator does not need one: it
    # fetches the probes over the network, and the two to point at are
    # /health/live (restart this container) and /health/ready (take it out of
    # the load balancer).
    volumes:
      # Without this, every container restart loses the uploaded files.
      - attachment-data:/var/lib/construction/storage

  # Nightly backup. Opt-in, so `docker compose up` stays a two-container
  # development stack: enable it with `--profile backup`, or in the deployment
  # compose file where it belongs.
  #
  # The dumps land on their own volume. That is the minimum, not the goal — a
  # volume on the same host as the database survives a dropped table and a bad
  # migration, and does not survive the host. Ship them off the machine; see
  # the runbook in docs/PROVISIONING.md.
  backup:
    image: postgres:16-alpine
    container_name: construction-backup
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env first}
      PGDATABASE: construction
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts:/scripts:ro
      - backup-data:/backups
    # bash, because the scripts use arrays and process substitution that the
    # alpine image's default shell does not have.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache bash coreutils findutils >/dev/null
        while true; do
          bash /scripts/backup.sh || echo "backup failed" >&2
          sleep 86400
        done
    restart: unless-stopped

volumes:
  postgres-data:
  attachment-data:
  backup-data:
