name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push supersedes an in-flight run on the same ref, so a branch being
# pushed repeatedly does not queue up stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches docker-compose.yml, so CI and local development agree.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # The integration tests create their own database, so the job must
        # not start until the server is actually accepting connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: >-
          dotnet test tests/Construction.UnitTests
          --no-build --configuration Release --verbosity normal

      - name: Integration tests
        env:
          ConstructionTests__Postgres: Host=localhost;Port=5432;Username=postgres;Password=postgres
        run: >-
          dotnet test tests/Construction.IntegrationTests
          --no-build --configuration Release --verbosity normal

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/construction_mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  admin:
    name: Admin (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/construction_admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/construction_admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Type-checks with tsc -b before bundling, so a type error fails here.
      # `tsconfig.app.json` includes the whole of `src`, which means the test
      # files are type-checked too.
      - name: Build
        run: npm run build

  # The browser suite is its own job because it needs what the others do not:
  # a database, the .NET SDK to run the real API, and a browser. Kept separate
  # so a failure here is legible as "the whole system disagreed" rather than
  # hiding inside the admin job's lint output.
  e2e:
    name: End to end (browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/construction_admin

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      # The suite starts the API itself — see `webServer` in
      # playwright.config.ts — so the SDK has to be here even though this job
      # builds no C# of its own.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/construction_admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chromium only. The suite asserts behaviour and layout, not rendering
      # differences between engines, so three browsers would triple the run
      # for no extra finding.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # Only on a failure, and only then is it worth anything: the trace
      # replays the run step by step, which is the difference between fixing a
      # CI-only failure and guessing at it.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: src/construction_admin/test-results/
          retention-days: 7
