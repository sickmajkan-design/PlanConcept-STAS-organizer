name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push supersedes an in-flight run on the same ref, so a branch being
# pushed repeatedly does not queue up stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches docker-compose.yml, so CI and local development agree.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # The integration tests create their own database, so the job must
        # not start until the server is actually accepting connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # `minimal`, not `normal`. At `normal` every passing test prints a line,
      # and with 559 of them a single failure is pushed thousands of lines up
      # the log — which is exactly where it went the first time one happened,
      # leaving a red build whose reason had to be guessed at. At `minimal`
      # only failures and the summary are printed, so the reason is the last
      # thing in the log.
      - name: Unit tests
        run: >-
          dotnet test tests/Construction.UnitTests
          --no-build --configuration Release --verbosity minimal

      - name: Integration tests
        env:
          ConstructionTests__Postgres: Host=localhost;Port=5432;Username=postgres;Password=postgres
        run: >-
          dotnet test tests/Construction.IntegrationTests
          --no-build --configuration Release --verbosity minimal

      # The suite applies every migration forward on every run, so the forward
      # path is exercised continuously and the backward path was not exercised
      # at all — which is the state a rollback is discovered to be broken in,
      # during an incident, on the only copy of the data that matters. This
      # rolls the newest migration back with data in the tables and compares,
      # then walks the whole history down and up again. Around a minute.
      - name: Rehearse a rollback
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: scripts/rehearse-migrations.sh

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/construction_mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # The Android build, which nothing else here does.
  #
  # `flutter analyze` and `flutter test` run entirely on the Dart side: they
  # never invoke Gradle, never resolve an Android dependency and never see the
  # manifest. So a plugin that raises its `compileSdk`, an AndroidX conflict, or
  # a permission that no longer merges is invisible to both — and stays
  # invisible until somebody builds a release by hand, which on this project
  # would be shortly before handing an APK to a site.
  #
  # It is its own job rather than two more steps in `mobile`, because it is the
  # slow one (a cold Gradle build is minutes, the Dart checks are seconds) and
  # because a failure here means something quite different: not "the code is
  # wrong" but "the app cannot be packaged".
  android:
    name: Mobile (Android build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/construction_mobile

    steps:
      - uses: actions/checkout@v4

      # Gradle needs a JDK of its own; the runner's default is not guaranteed
      # to be the one the Android Gradle Plugin supports.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Debug, not release. Release signing reads `android/key.properties` and
      # a keystore that are both git-ignored and deliberately absent from CI —
      # see the comment in android/app/build.gradle.kts. A debug build resolves
      # every Android dependency, runs the manifest merger and compiles the
      # Kotlin and Java sources, which is the whole of what this job is for.
      # Whether the release *signs* is a separate question, and one only the
      # holder of the keystore can answer.
      - name: Build the debug APK
        run: flutter build apk --debug

      # Kept, not thrown away. The job already produces the exact file somebody
      # needs to put the app on a phone, and without this it is deleted when
      # the runner shuts down — leaving "build a test APK" as a task requiring
      # an Android SDK that most people asking for one do not have.
      #
      # Debug-signed, so it installs from a file manager after allowing
      # unknown sources, and it cannot be published to Play. The server address
      # is not baked in: the app asks for one on its sign-in screen, so this
      # single file works against any installation.
      - name: Keep the APK so it can be installed
        uses: actions/upload-artifact@v7
        with:
          name: construction-organizer-debug-apk
          path: src/construction_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  admin:
    name: Admin (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/construction_admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/construction_admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Type-checks with tsc -b before bundling, so a type error fails here.
      # `tsconfig.app.json` includes the whole of `src`, which means the test
      # files are type-checked too.
      - name: Build
        run: npm run build

  # The browser suite is its own job because it needs what the others do not:
  # a database, the .NET SDK to run the real API, and a browser. Kept separate
  # so a failure here is legible as "the whole system disagreed" rather than
  # hiding inside the admin job's lint output.
  e2e:
    name: End to end (browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/construction_admin

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      # The suite starts the API itself — see `webServer` in
      # playwright.config.ts — so the SDK has to be here even though this job
      # builds no C# of its own.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/construction_admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chromium only. The suite asserts behaviour and layout, not rendering
      # differences between engines, so three browsers would triple the run
      # for no extra finding.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # Only on a failure, and only then is it worth anything: the trace
      # replays the run step by step, which is the difference between fixing a
      # CI-only failure and guessing at it.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-trace
          path: src/construction_admin/test-results/
          retention-days: 7
