version: 2

# Weekly, on Monday morning, and grouped.
#
# Grouping is the whole difference between this being useful and being noise.
# Ungrouped, a Monday produces eleven pull requests — one per Microsoft.* package
# that moved together anyway — and by the third week nobody opens any of them. A
# security update still gets its own pull request, because that one is meant to
# interrupt.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      # These ship as a set and are version-locked to each other; splitting them
      # produces pull requests that cannot build on their own.
      #
      # `System.IdentityModel.Tokens.Jwt` and the `Microsoft.IdentityModel.*`
      # family belong in here and were missing from the first version of this
      # file. `Microsoft.AspNetCore.Authentication.JwtBearer` depends on
      # `Microsoft.IdentityModel.Protocols.OpenIdConnect`, which requires a
      # matching `System.IdentityModel.Tokens.Jwt`; this project references that
      # one directly, so moving JwtBearer on its own produced NU1605 — "detected
      # package downgrade" — and a pull request that could not restore, let
      # alone build. Grouping them means the whole set moves at once or not at
      # all.
      aspnetcore-and-ef:
        patterns:
          - 'Microsoft.AspNetCore.*'
          - 'Microsoft.EntityFrameworkCore*'
          - 'Microsoft.Extensions.*'
          - 'Microsoft.IdentityModel.*'
          - 'System.IdentityModel.Tokens.Jwt'
          - 'Npgsql.EntityFrameworkCore.*'
      observability:
        patterns:
          - 'OpenTelemetry*'
          - 'Serilog*'
      # `Microsoft.AspNetCore.Mvc.Testing` is deliberately NOT here, though it
      # looks like test tooling. It pulls in `Microsoft.Extensions.Hosting`,
      # which requires a matching `Microsoft.Extensions.Configuration.Json` —
      # a package the integration tests reference directly. Listing it here
      # separated it from the group those siblings live in, and the result was
      # the same NU1605 downgrade as the JWT pair above, on a different pair.
      # It belongs to `aspnetcore-and-ef` via `Microsoft.AspNetCore.*`.
      test-tooling:
        patterns:
          - 'xunit*'
          - 'Microsoft.NET.Test.Sdk'

  - package-ecosystem: npm
    directory: /src/construction_admin
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react*'
      mui:
        patterns:
          - '@mui/*'
          - '@emotion/*'
      tooling:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'vitest'
          - '@testing-library/*'
          - 'typescript'
          - 'oxlint'
          - '@playwright/test'

  # pub has no vulnerability database, so this is the only thing watching the
  # Flutter tree at all — it reports age, not advisories. See
  # scripts/check-dependencies.sh.
  - package-ecosystem: pub
    directory: /src/construction_mobile
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      firebase:
        patterns:
          - 'firebase_*'
      riverpod-and-codegen:
        patterns:
          - 'flutter_riverpod'
          - 'riverpod*'
          - 'freezed*'
          - 'json_*'
          - 'build_runner'

  # The actions in .github/workflows are dependencies too, and a pinned action
  # that goes unmaintained is exactly the kind of thing nobody notices.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
